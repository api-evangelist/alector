name: Alector
description: 'Alector is a clinical-stage biotechnology company developing immuno-neurology
  therapies for neurodegenerative diseases, including frontotemporal dementia (FTD),
  Alzheimer''s disease, and amyotrophic lateral sclerosis (ALS). Combining human genetics,
  neuroscience, and immunology, the company designs potential first- and best-in-class
  medicines that remove toxic proteins, replace deficient proteins, and restore immune
  and nerve cell function. Alector was added to the API Evangelist network as a GV
  portfolio company; it publishes no public developer API, SDK, or documentation surface,
  so this profile captures corporate and domain-security signals only.'
